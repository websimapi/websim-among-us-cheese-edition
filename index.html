<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us: Cheese Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="loadingScreen">
            <h1>Among Us: Cheese Edition</h1>
            <div id="loadingText">Generating spaceship map...</div>
            <div class="loading-spinner"></div>
        </div>
        
        <div id="gameScreen" style="display: none;">
            <div id="gameHUD">
                <div id="playerInfo">
                    <span id="playerName">Player</span>
                    <span id="playerRole">Crewmate</span>
                </div>
                <div id="taskCounter">Tasks: <span id="taskCount">0/5</span></div>
                <button id="emergencyButton">Emergency Meeting</button>
            </div>
            
            <canvas id="gameCanvas"></canvas>
            
            <div id="mobileControls">
                <div id="joystick">
                    <div id="joystickKnob"></div>
                </div>
                <button id="useButton">Use/Kill</button>
                <button id="reportButton">Report</button>
            </div>
        </div>
        
        <div id="meetingScreen" style="display: none;">
            <h2>Emergency Meeting</h2>
            <div id="playerList"></div>
            <div id="chatArea">
                <div id="messages"></div>
                <input type="text" id="chatInput" placeholder="Discuss who is suspicious...">
                <button id="sendMessage">Send</button>
            </div>
            <div id="voteArea">
                <button id="skipVote">Skip Vote</button>
            </div>
        </div>
        
        <div id="gameOverScreen" style="display: none;">
            <h1 id="gameResult"></h1>
            <button id="playAgain">Play Again</button>
        </div>
    </div>
    
    <script type="module" src="game.js"></script>

</body>
</html>
